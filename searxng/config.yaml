name: "SearXNG"
slug: "searxng"
description: "Private SearXNG metasearch engine with persistent configuration, built-in MCP server, smart presets & live search inspector"
version: "1.4.0"
url: "https://github.com/cs-gergely04/ha-searxng-addon"
startup: services
boot: auto
init: false

arch:
  - amd64
  - aarch64

ports:
  8080/tcp: 8888
  8889/tcp: 8889

ports_description:
  8080/tcp: "SearXNG web interface & JSON API"
  8889/tcp: "Built-in MCP Server (/mcp, /sse) & Search Inspector (/logs)"

webui: "http://[HOST]:[PORT:8080]"

map:
  - addon_config:rw

options:
  secret_key: ""
  mcp_enabled: true
  mcp_max_results: 5
  instance_name: "SearXNG"
  default_lang: "auto"
  default_locale: ""
  autocomplete: "duckduckgo"
  safe_search: 0
  theme_style: "auto"
  infinite_scroll: false
  results_on_new_tab: false
  search_on_category_select: true
  query_in_title: false
  image_proxy: true
  enabled_engines: []
  disabled_engines:
    - "wikidata"
  search_presets:
    - alias: "local_news"
      description: "Get a randomized digest of 4 local Vojvodina and Subotica news stories in Hungarian (Pannon RTV) with headlines and short leads. Summarize each in 1 sentence and let the user pick one to read in detail."
      sites: "pannonrtv.com, pannonrtv.rs"
      default_query: "hírek vajdaság szabadka"
      categories: "general,news"
      engines: ""
      language: "hu"
      time_range: "week"
      response_mode: "digest"
      shuffle_results: true
      max_results: 4
      digest_words: 25
      fetch_top_n: 0
    - alias: "it_news"
      description: "Get a randomized digest of 4 latest IT, software engineering, AI, and technology news stories with headlines and short leads. Summarize each in 1 sentence and let the user pick one to explore."
      sites: ""
      default_query: "technology software AI cybersecurity news"
      categories: "it,news"
      engines: ""
      language: "en"
      time_range: "week"
      response_mode: "digest"
      shuffle_results: true
      max_results: 4
      digest_words: 25
      fetch_top_n: 0
    - alias: "detailed_search"
      description: "Deep detailed search for a specific topic, news story, or question. Finds the top matching result and extracts its full article text so you can give a comprehensive answer."
      sites: ""
      default_query: ""
      categories: "general,news"
      engines: ""
      language: ""
      time_range: "any"
      response_mode: "detailed"
      shuffle_results: false
      max_results: 3
      digest_words: 35
      fetch_top_n: 1
    - alias: "tech_docs"
      description: "Detailed technical documentation search across GitHub, StackOverflow, and Home Assistant docs with full-page content extraction of the top result."
      sites: "github.com, stackoverflow.com, docs.home-assistant.io, community.home-assistant.io"
      default_query: ""
      categories: "it,general"
      engines: ""
      language: "en"
      time_range: "any"
      response_mode: "detailed"
      shuffle_results: false
      max_results: 3
      digest_words: 35
      fetch_top_n: 1
  reset_settings_yml: false

schema:
  secret_key: "str?"
  mcp_enabled: "bool?"
  mcp_max_results: "int(1,25)?"
  instance_name: "str?"
  default_lang: "str?"
  default_locale: "str?"
  autocomplete: "list(none|duckduckgo|google|bing|brave|startpage|wikipedia|qwant|seznam|mwmbl|360search|baidu|naver|sogou|swisscows|quark|yandex)?"
  safe_search: "int(0,2)?"
  theme_style: "list(auto|light|dark|black)?"
  infinite_scroll: "bool?"
  results_on_new_tab: "bool?"
  search_on_category_select: "bool?"
  query_in_title: "bool?"
  image_proxy: "bool?"
  enabled_engines:
    - "str?"
  disabled_engines:
    - "str?"
  search_presets:
    - alias: "str"
      description: "str?"
      sites: "str?"
      default_query: "str?"
      query_template: "str?"
      categories: "str?"
      engines: "str?"
      language: "str?"
      time_range: "list(any|day|week|month|year)?"
      response_mode: "list(digest|detailed)?"
      shuffle_results: "bool?"
      max_results: "int(1,25)?"
      digest_words: "int(5,100)?"
      fetch_top_n: "int(0,10)?"
  reset_settings_yml: "bool?"
