name: "SearXNG"
slug: "searxng"
description: "Private SearXNG metasearch engine with persistent configuration, built-in MCP server & smart search presets"
version: "1.3.1"
url: "https://github.com/cs-gergely04/ha-searxng-addon"
startup: services
boot: auto
init: false

arch:
  - amd64
  - aarch64

ports:
  8080/tcp: 8888
  8889/tcp: 8889

ports_description:
  8080/tcp: "SearXNG web interface & JSON API"
  8889/tcp: "Built-in MCP Server (Streamable HTTP /mcp & SSE /sse)"

webui: "http://[HOST]:[PORT:8080]"

map:
  - addon_config:rw

options:
  secret_key: ""
  mcp_enabled: true
  mcp_max_results: 8
  instance_name: "SearXNG"
  default_lang: "auto"
  default_locale: ""
  autocomplete: "duckduckgo"
  safe_search: 0
  theme_style: "auto"
  infinite_scroll: false
  results_on_new_tab: false
  search_on_category_select: true
  query_in_title: false
  image_proxy: true
  enabled_engines: []
  disabled_engines:
    - "wikidata"
  search_presets:
    - alias: "local_news"
      description: "Search local Vojvodina and Subotica news in Hungarian (Pannon RTV). Automatically extracts the full text of the top 3 news articles."
      sites: "pannonrtv.com, pannonrtv.rs"
      default_query: "hírek vajdaság szabadka"
      categories: "general,news"
      engines: ""
      language: "hu"
      time_range: "week"
      max_results: 6
      fetch_top_n: 3
    - alias: "it_news"
      description: "Search latest IT, software engineering, AI, cybersecurity, and technology news. Automatically extracts full article text for top results."
      sites: ""
      default_query: "technology software AI cybersecurity news"
      categories: "it,news"
      engines: ""
      language: "en"
      time_range: "week"
      max_results: 8
      fetch_top_n: 2
    - alias: "tech_docs"
      description: "Search technical documentation, GitHub issues, StackOverflow, and developer guides with full-page content extraction."
      sites: "github.com, stackoverflow.com, docs.home-assistant.io, community.home-assistant.io"
      default_query: ""
      categories: "it,general"
      engines: ""
      language: "en"
      time_range: "any"
      max_results: 6
      fetch_top_n: 2
  reset_settings_yml: false

schema:
  secret_key: "str?"
  mcp_enabled: "bool?"
  mcp_max_results: "int(1,25)?"
  instance_name: "str?"
  default_lang: "str?"
  default_locale: "str?"
  autocomplete: "list(none|duckduckgo|google|bing|brave|startpage|wikipedia|qwant|seznam|mwmbl|360search|baidu|naver|sogou|swisscows|quark|yandex)?"
  safe_search: "int(0,2)?"
  theme_style: "list(auto|light|dark|black)?"
  infinite_scroll: "bool?"
  results_on_new_tab: "bool?"
  search_on_category_select: "bool?"
  query_in_title: "bool?"
  image_proxy: "bool?"
  enabled_engines:
    - "str?"
  disabled_engines:
    - "str?"
  search_presets:
    - alias: "str"
      description: "str?"
      sites: "str?"
      default_query: "str?"
      query_template: "str?"
      categories: "str?"
      engines: "str?"
      language: "str?"
      time_range: "list(any|day|week|month|year)?"
      max_results: "int(1,25)?"
      fetch_top_n: "int(0,10)?"
  reset_settings_yml: "bool?"
